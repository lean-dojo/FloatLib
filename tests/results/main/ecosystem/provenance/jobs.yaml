apiVersion: batch/v1
kind: Job
metadata:
  name: floatlean-external-wave1
  labels:
    app: floatlean-external-ecosystem
    campaign: "20260910t150728z"
spec:
  completionMode: Indexed
  completions: 10
  parallelism: 10
  backoffLimitPerIndex: 0
  maxFailedIndexes: 10
  activeDeadlineSeconds: 129600
  template:
    metadata:
      labels:
        app: floatlean-external-ecosystem
        campaign: "20260910t150728z"
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: amd64
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: floatlean-external-ecosystem
                  campaign: "20260910t150728z"
              topologyKey: kubernetes.io/hostname
      containers:
        - name: suite
          image: ubuntu:24.04
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              suites=(
                fpbench
                daisy
                fptaylor
                herbie
                core-math
                rlibm-all
                openlibm
                flit
                verificarlo
                reductions
              )
              export SUITE="${suites[$JOB_INDEX]}"
              exec /bin/bash /efs/robert/floatlean-results/332491fd0acb7702b5730aa96bf5927063583d92/20260910T150728Z/ecosystem/control/run-suite.sh
          env:
            - name: JOB_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: CPU_LIMIT
              value: "180"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: "180"
              memory: 300Gi
            limits:
              cpu: "180"
              memory: 300Gi
          volumeMounts:
            - name: efs
              mountPath: /efs
      volumes:
        - name: efs
          persistentVolumeClaim:
            claimName: efs-pvc
