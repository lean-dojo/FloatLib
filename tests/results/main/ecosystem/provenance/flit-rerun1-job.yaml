apiVersion: batch/v1
kind: Job
metadata:
  name: floatlean-flit-rerun1
  labels:
    app: floatlean-external-ecosystem
    campaign: "20260910t150728z"
spec:
  completionMode: Indexed
  completions: 3
  parallelism: 3
  backoffLimitPerIndex: 0
  maxFailedIndexes: 3
  activeDeadlineSeconds: 43200
  template:
    metadata:
      labels:
        app: floatlean-external-ecosystem
        campaign: "20260910t150728z"
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: amd64
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: floatlean-external-ecosystem
                  campaign: "20260910t150728z"
              topologyKey: kubernetes.io/hostname
      containers:
        - name: flit
          image: ubuntu:22.04@sha256:829f6df217bcbae2b371026e81711d1a787c61b2967ad09d015063663ebafbf7
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              variants=(base openmpi mpich)
              export FLIT_VARIANT="${variants[$JOB_INDEX]}"
              exec /bin/bash /efs/robert/floatlean-results/332491fd0acb7702b5730aa96bf5927063583d92/20260910T150728Z/ecosystem/control/run-flit-rerun1.sh
          env:
            - name: JOB_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: "180"
              memory: 300Gi
            limits:
              cpu: "180"
              memory: 300Gi
          volumeMounts:
            - name: efs
              mountPath: /efs
      volumes:
        - name: efs
          persistentVolumeClaim:
            claimName: efs-pvc
